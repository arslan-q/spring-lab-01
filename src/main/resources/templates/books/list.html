<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}">SpringLab</a><nav><span sec:authentication="name">user</span><span class="role-pill" sec:authentication="principal.authorities">[ROLE_USER]</span><a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Administration</a><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Log out</button></form></nav></header>
<main class="page-wrap">
<p class="eyebrow">BOOK CATALOGUE</p><h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>

<form th:action="@{/books}" method="post" sec:authorize="hasRole('ADMIN')" class="book-form">
    <input type="text" name="title" placeholder="Title" required>
    <input type="text" name="author" placeholder="Author" required>
    <input type="number" name="year" placeholder="Year" required>
    <button type="submit">Add Book</button>
</form>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
    </tbody>
</table>
</main>
</body>
</html>
