<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | SpringLab</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand" th:href="@{/}">SpringLab <span>SECURITY</span></a>
    <h1>Create account</h1>
    <p class="muted">A new account receives the USER role.</p>
    <p class="notice error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" method="post" class="form-stack">
        <label>Username<input type="text" name="username" maxlength="60" th:value="${username}" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <button type="submit">Create account</button>
    </form>
    <p class="muted">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
