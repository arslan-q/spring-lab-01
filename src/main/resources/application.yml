spring:
  application:
    name: spring-lab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springlab}
    username: ${SPRING_DATASOURCE_USERNAME:springlab}
    password: ${SPRING_DATASOURCE_PASSWORD:springlab}
  flyway:
    enabled: true
  sql:
    init:
      mode: never

server:
  port: 8080

app:
  owner: Abdullin Arslan
  group: IT1CCO-2501IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  security:
    token-ttl: 60m
    min-password-length: 8

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
