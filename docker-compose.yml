services:
  postgres:
    image: postgres:16
    container_name: springlab-postgres
    environment:
      POSTGRES_DB: springlab
      POSTGRES_USER: springlab
      POSTGRES_PASSWORD: springlab
    ports:
      - "5432:5432"
    volumes:
      - springlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springlab -d springlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  springlab-postgres-data:
